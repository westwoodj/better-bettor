name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GOOGLE_GENAI_API_KEY: ${{ secrets.GOOGLE_AI_STUDIO_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: '3.14'

      - name: Install dependencies from uv.lock (deterministic)
        run: uv sync --locked

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          uv run pytest -q
  test:
    runs-on: ubuntu-latest
    env:
      # To skip ruff in local runs or special CI runs set the repo secret SKIP_RUFF to 'true'
      SKIP_RUFF: ${{ secrets.SKIP_RUFF }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: '3.14'

      - name: Install dependencies from uv.lock (deterministic)
        run: uv sync --locked

      - name: Lint with ruff
        if: env.SKIP_RUFF != 'true'
        run: |
          # Fail CI on lint errors
          uv run ruff check .

      - name: Run tests under coverage and produce xml
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          uv run coverage run -m pytest -q
          uv run coverage xml -i

      - name: Upload coverage to Codecov
        if: secrets.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Run plain pytest (sanity)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          uv run pytest -q
